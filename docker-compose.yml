version: '3.8'

services:
  backend:
    container_name: figma-ai-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${FIGMA_AI_BACKEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # Google Drive OAuth2 Configuration (required for Drive integration)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/drive/callback}
    restart: unless-stopped
    networks:
      - figma-ai-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  figma-ai-network:
    driver: bridge
