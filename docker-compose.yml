version: '3.8'

services:
  backend:
    container_name: figma-ai-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${FIGMA_AI_BACKEND_PORT:-3000}:3000"
    env_file:
      - ./backend/.env
    environment:
      # OPENAI_API_KEY é enviada pelo plugin Figma em cada requisição
      # Definir aqui é opcional (fallback para desenvolvimento/testes)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - figma-ai-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  figma-ai-network:
    driver: bridge
