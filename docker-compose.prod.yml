version: '3.8'

# Docker Compose para PRODUÇÃO
# Uso: docker-compose -f docker-compose.prod.yml up -d

services:
  backend:
    container_name: figma-ai-backend-prod
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    ports:
      - "${FIGMA_AI_BACKEND_PORT:-3000}:3000"
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: always
    networks:
      - figma-ai-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Opcional: Nginx como reverse proxy
  # nginx:
  #   image: nginx:alpine
  #   container_name: figma-ai-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - backend
  #   networks:
  #     - figma-ai-network
  #   restart: always

networks:
  figma-ai-network:
    driver: bridge
