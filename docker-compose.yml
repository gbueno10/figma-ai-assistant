services:
  backend:
    build:
      context: ./backend
    ports:
      - "${FIGMA_AI_BACKEND_PORT:-3000}:3000"
    env_file:
      - ./backend/.env
    environment:
      # Allow overriding via environment variables when needed
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    restart: unless-stopped
